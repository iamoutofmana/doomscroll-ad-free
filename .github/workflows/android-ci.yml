name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# CI only needs to read the repository; no write scope for the token.
permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching and wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint, unit tests, debug APK
        run: ./gradlew ktlintCheck test assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doomscroll-ad-free-debug-apk
          path: app/build/outputs/apk/debug/*.apk
