Summary: Ad-free feed reader for your own sources
Description: |-
  Doomscroll Ad Free is an ad-free, open-source feed reader for Android that replaces the
  OEM "media page" with your own sources: Google News topics and keyword searches, any
  RSS/Atom/JSON feed, YouTube channels, Reddit, Lemmy and Hacker News. These are aggregated
  into one clean scrolling feed, a built-in reader extracts full articles without publisher
  ads, and home-screen widgets mimic a media page.

  No accounts, no ads, no sponsored items, no analytics and no tracking. Network access is
  limited to the feeds and article pages you choose, everything stays on the device, and
  the app is licensed GPL-3.0-or-later.

  This repository is hosted by the app's developer and distributes the same APK that is
  published on GitHub Releases, signed with the project release key.

